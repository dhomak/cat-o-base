{# Phone number with call / SMS / WhatsApp / Telegram links. #}
{% macro phone(number) -%}
{% set links = phone_links(number) %}
{% if links %}
<span class="phone">
  <a href="{{ links.tel }}" title="{{ _("Call") }}">📞 {{ number }}</a>
  <a class="pa" href="{{ links.sms }}" title="{{ _("Text message") }}">{{ _("SMS") }}</a>
  <a class="pa" href="{{ links.whatsapp }}" target="_blank" rel="noopener" title="{{ _("WhatsApp") }}">{{ _("WhatsApp") }}</a>
  <a class="pa" href="{{ links.telegram }}" target="_blank" rel="noopener" title="{{ _("Telegram (if they allow finding them by number)") }}">{{ _("Telegram") }}</a>
</span>
{% elif number %}<span>{{ number }}</span>{% endif %}
{%- endmacro %}
